function findEnglishSearch(title){const pairs=[[/みたらし|団子/,'mitarashi dango'],[/かぼちゃ.*アイス/,'pumpkin ice cream'],[/きなこ.*アイス/,'soy flour ice cream'],[/きなこ.*ケーキ/,'kinako cake'],[/きなこ.*クッキー/,'kinako cookies'],[/チョコ.*ケーキ|ガトーショコラ/,'chocolate cake'],[/アイス/,'ice cream dessert'],[/ケーキ/,'cake dessert'],[/クッキー/,'cookies dessert'],[/プリン/,'pudding dessert'],[/パン/,'bread food'],[/カレー/,'curry food']];return pairs.find(([re])=>re.test(title))?.[1]||`${title} food`}
function removeTags(s){const d=document.createElement('div');d.innerHTML=String(s||'').replace(/<script[\s\S]*?<\/script>/gi,'');return d.textContent||'';}
async function commonsPhotos(title){const term=findEnglishSearch(title);const url='https://commons.wikimedia.org/w/api.php?'+new URLSearchParams({action:'query',generator:'search',gsrsearch:`filetype:bitmap ${term}`,gsrnamespace:'6',gsrlimit:'18',prop:'imageinfo',iiprop:'url|extmetadata',iiurlwidth:'550',format:'json',origin:'*'});
 const res=await fetch(url);if(!res.ok)throw new Error('画像検索サーバーに接続できません');const data=await res.json();const pages=Object.values(data?.query?.pages||{});
 return pages.map(p=>{const ii=p.imageinfo?.[0],ex=ii?.extmetadata||{},license=removeTags(ex.LicenseShortName?.value||'');const good=/CC|public domain|PD|CC0/i.test(license);const image=ii?.thumburl||ii?.url||'';return{src:image,credit:removeTags(ex.Artist?.value||ex.Credit?.value||'Wikimedia Commons').slice(0,180),license,licenseUrl:ex.LicenseUrl?.value||'',page:`https://commons.wikimedia.org/wiki/${encodeURIComponent(p.title||'')}`,...{good}};}).filter(p=>p.good&&/^https:/.test(p.src)&&!p.src.toLowerCase().endsWith('.svg')).slice(0,12);
}
async function autoCover(id){const r=recipes.find(x=>x.id===id);if(!r||r.coverType==='commons'||r.coverType==='own')return;try{const photos=await commonsPhotos(r.title);if(!photos.length)return;const p=photos[0];const upd={...r,cover:p.src,coverType:'commons',coverAttribution:`${p.credit||'Wikimedia Commons'} / ${p.license}`,coverInfo:p};await putRecipe(upd);await refresh();toast('再利用条件付きの参考画像を設定しました。写真はいつでも変更できます。');}catch(e){console.warn('Reference photo unavailable',e);}}

function dataUrl(file){return new Promise((resolve,reject)=>{const rd=new FileReader();rd.onload=()=>resolve(rd.result);rd.onerror=()=>reject(rd.error);rd.readAsDataURL(file)});}
async function resizeImage(file,w=900,h=750,quality=.82,part='whole'){const url=await dataUrl(file);return resizeDataUrl(url,w,h,quality,part);}
async function resizeDataUrl(url,w=900,h=750,quality=.82,part='whole'){const im=new Image();im.src=url;await im.decode();const cv=document.createElement('canvas');let x=0,y=0,ww=im.width,hh=im.height;if(part==='screenshotTop'&&im.height>im.width*1.35){ // video excerpt on vertical social screenshots
  x=im.width*.285;y=im.height*.045;ww=im.width*.43;hh=Math.min(im.height*.26,ww*1.2);
 }
 const scale=Math.min(w/ww,h/hh,1.6);cv.width=Math.max(1,Math.round(ww*scale));cv.height=Math.max(1,Math.round(hh*scale));cv.getContext('2d').drawImage(im,x,y,ww,hh,0,0,cv.width,cv.height);return cv.toDataURL('image/jpeg',quality);}
function cleanedLine(line){return line.replace(/[\u200B\uFEFF]/g,'').replace(/^[•●∙・﹒·\-\*]\s*/,'').trim();}
function parseOCR(txt,fileName){
 let lines=String(txt||'').split(/\r?\n/).map(s=>s.trim().replace(/\s{2,}/g,' ')).filter(Boolean);
 const titleCandidate=lines.slice(0,10).find(x=>/アイス|ケーキ|クッキー|団子|プリン|パン|グラタン|炒め|スープ|サラダ|もち|カレー|生きなこ|太らない/i.test(x)&&!/^([①-⑩]|\d+[.．])/.test(x));
 let title=titleCandidate||lines.slice(0,5).find(x=>!/^材料|^▷|^▽|^作り方|^栄養/.test(x)&&x.length>=4&&x.length<65)||`スクショから追加 ${new Date().toLocaleDateString('ja-JP')}`;
 title=title.replace(/^([1-9]|①|②|③|④|⑤)[\s.:：]/,'').replace(/^[▷▶▽□\s]+/,'').replace(/[🍰🍪✨💛🤍🏆]+/g,'').trim();
 if(title.length>72)title=title.slice(0,72);
 let section='none',ing=[],steps=[],nut=[];
 for(let line of lines){
   if(/^(?:[▷▶▽\s]*|\d?[️⃣\s]*)(?:材料|材料:|材料：|使用材料)/.test(line)){section='ing';continue;}
   if(/(?:作り方|作りかた|つくり方)/.test(line)&&line.length<18){section='steps';continue;}
   if(/(?:栄養成分|エネルギー|栄養情報)/.test(line)&&section!=='ing'){section='nutrition';if(/(?:kcal|たんぱく|タンパク)/.test(line))nut.push(line);continue;}
   if(/コメント|感想を送っ|フォローする|返信する|プロフ|公式アカウント|ログイン/.test(line))break;
   if(section==='ing'){
     let x=cleanedLine(line);
     if(!x||x===title)continue;
     if(x.length>75){ing.push(x.slice(0,75));continue;}
     if(/^([0-9０-９]|①|②|③|④|⑤)[.．、\s]/.test(x)&&!/g|ml|大さじ|小さじ|個|本|枚|適量|cc|カップ|粒/.test(x)){section='steps';steps.push(x);continue;}
     ing.push(x);
   }else if(section==='steps'){steps.push(line);}else if(section==='nutrition'){nut.push(line);}
 }
 // Recognizers sometimes don't detect the section separators. Recover from visible numbered methods.
 if(!steps.length){let idx=lines.findIndex(x=>/^(?:[①-⑩]|[1-9１-９][.．、])/.test(x));if(idx>=0)steps=lines.slice(idx).filter(x=>!/栄養成分|エネルギー|kcal|コメント/.test(x)).slice(0,18);}
 if(!ing.length){ing=lines.filter(x=>/\d+\s*(?:g|ml|cc)|大さじ|小さじ|適量|個|枚/.test(x)&&!/kcal|たんぱく|食物繊維/.test(x)).slice(0,17).map(cleanedLine);}
 return{title,category:classify(title),ingredients:ing.join('\n'),steps:steps.join('\n'),nutrition:nut.join(' / '),rawText:txt||'',originalName:fileName};
}
let enginePromise=null;
function loadOCR(){if(enginePromise)return enginePromise;enginePromise=(async()=>{
 if(!window.Tesseract){setBusy('日本語文字認識を読み込んでいます...',9);await new Promise((resolve,reject)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';sc.onload=resolve;sc.onerror=()=>reject(new Error('OCRプログラムのダウンロードに失敗'));document.head.appendChild(sc);});}
 worker=await Tesseract.createWorker('jpn',1,{logger:e=>{if(e.status==='recognizing text'){$('ocrFill').style.width=`${Math.min(99,15+Math.round((e.progress||0)*78))}%`;}}});
 return worker;})();return enginePromise;}
async function ocrImage(file){const img=new Image();img.src=await dataUrl(file);await img.decode();const cv=document.createElement('canvas');const ratio=img.height/img.width;const sx=img.width*.022,sw=img.width*.955,sy=ratio>1.45?img.height*.313:0,sh=ratio>1.45?img.height*.57:img.height;let scale=Math.min(2.1,1600/sw);cv.width=Math.round(sw*scale);cv.height=Math.round(sh*scale);const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);ctx.drawImage(img,sx,sy,sw,sh,0,0,cv.width,cv.height);const ocr=await loadOCR();const result=await ocr.recognize(cv);return result.data.text||'';}
async function importFiles(files){if(processing||!files.length)return;processing=true;let count=0,needEdit=0;for(let i=0;i<files.length;i++){
 const f=files[i];if(!f.type.startsWith('image/')){toast(`${f.name}: 画像ファイルを選んでください`);continue;}
 setBusy(`(${i+1}/${files.length}) ${f.name}を読み取っています`,8);

 setBusy(`(${i+1}/${files.length}) レシピに保存しています`,97);
 try{const cover=await resizeImage(f,680,590,.73,'screenshotTop');const now=new Date().toISOString();const r={id:uuid(),...draft,source:'',notes:error||'スクショから自動登録。材料と作り方を確認してください。',cover,coverAttribution:'アップロードしたスクリーンショットの一部（個人用）',coverType:'screenshot',favorite:false,createdAt:now,updatedAt:now};
 await putRecipe(r);count++;await refresh();
 }catch(e){console.error(e);toast('保存に失敗しました。画像サイズまたは端末の容量をご確認ください。')}
}
processing=false;clearBusy();if(count){toast(`${count}品を登録しました${needEdit?'（'+needEdit+'品は手入力で修正が必要）':''}。文字認識結果をご確認ください。`);if(count===1){const latest=recipes.find(r=>r.originalName===files[0].name);if(latest)detail(latest.id);}}}
async function backup(){const payload={app:'recipebox-jp',version:1,exportedAt:new Date().toISOString(),recipes};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`レシピ箱バックアップ_${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),8000);toast('バックアップをダウンロードしました。大切に保管してください。');}
async function importBackup(file){let data;try{data=JSON.parse(await file.text());if(!Array.isArray(data.recipes)||data.app!=='recipebox-jp')throw new Error('不正なバックアップ形式');if(data.recipes.length>5000)throw new Error('多すぎるレシピ');let n=0;for(const item of data.recipes){if(!item.title)continue;const r={...item,id:String(item.id||uuid()),title:String(item.title).slice(0,120),cover:safeImg(item.cover),createdAt:item.createdAt||new Date().toISOString(),favorite:!!item.favorite};await putRecipe(r);n++;}await refresh();closeModal();toast(`${n}品のバックアップを取り込みました。`);}catch(e){console.error(e);toast('バックアップを読み込めませんでした。レシピ箱のJSONを選んでください。');}}
async function init(){try{db=await dbOpen();const seeded=await setting('initial-seed-v1');if(!seeded){for(const s of SEED_RECIPES)await putRecipe(s);await putSetting('initial-seed-v1',true);}await refresh();}catch(e){console.error(e);$('cards').innerHTML='<div class="empty">ブラウザに保存する領域を利用できません。プライベートモードを解除するか、別のブラウザで開いてください。</div>';toast('端末内データベースを利用できません。');}}
$('cards').addEventListener('click',async e=>{const fav=e.target.closest('[data-favorite]');if(fav){e.stopPropagation();const r=recipes.find(x=>x.id===fav.dataset.favorite);if(r){await putRecipe({...r,favorite:!r.favorite});await refresh();}return;}const card=e.target.closest('[data-id]');if(card)detail(card.dataset.id);});
$('cards').addEventListener('keydown',e=>{if(e.key==='Enter'){const c=e.target.closest('[data-id]');if(c)detail(c.dataset.id);}});
$('modalShell').addEventListener('click',async e=>{
 if(e.target===$('modalShell')||e.target.closest('[data-close]')){closeModal();return;}
 const target=e.target.closest('[data-edit],[data-photo],[data-delete],[data-favorite],[data-export],[data-import],[data-use-photo],[data-reset-seed]');if(!target)return;
 if(target.dataset.edit){edit(target.dataset.edit);return;}
 if(target.dataset.photo){imagePicker(target.dataset.photo);return;}
 if(target.dataset.delete){const id=target.dataset.delete;const r=recipes.find(x=>x.id===id);if(confirm(`「${r?.title||'レシピ'}」を削除しますか？`)){await dropRecipe(id);await refresh();closeModal();toast('削除しました');}return;}
 if(target.dataset.favorite){const id=target.dataset.favorite;const r=recipes.find(x=>x.id===id);if(r){await putRecipe({...r,favorite:!r.favorite});await refresh();detail(id);}return;}
 if('export' in target.dataset){backup();return;}
 if('import' in target.dataset){$('importInput').click();return;}
 if('resetSeed' in target.dataset){let n=0;for(const s of SEED_RECIPES){if(!recipes.find(x=>x.id===s.id)){await putRecipe(s);n++;}}await refresh();toast(`${n}品を追加しました。`);return;}
 if(target.dataset.usePhoto){const p=lastResults[Number(target.dataset.usePhoto)],r=recipes.find(x=>x.id===viewing);if(p&&r){await putRecipe({...r,cover:p.src,coverType:'commons',coverAttribution:`${p.credit||'Wikimedia Commons'} / ${p.license}`,coverInfo:p});await refresh();closeModal();detail(r.id);toast('画像を設定しました');}return;}
});
$('settingsBtn').addEventListener('click',settings);
$('newBtn').addEventListener('click',()=>edit(null));
$('uploadBtn').addEventListener('click',()=>$('fileInput').click());
$('fileInput').addEventListener('change',async e=>{const files=[...e.target.files];e.target.value='';await importFiles(files)});
$('importInput').addEventListener('change',async e=>{const f=e.target.files?.[0];e.target.value='';if(f)await importBackup(f)});
$('search').addEventListener('input',e=>{query=e.target.value.trim();render()});
document.querySelectorAll('[data-filter]').forEach(n=>n.addEventListener('click',()=>setFilter(n.dataset.filter)));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('modalShell').classList.contains('open'))closeModal();});
['dragenter','dragover'].forEach(name=>document.addEventListener(name,e=>{e.preventDefault();if(e.dataTransfer?.types.includes('Files'))$('dropMask').classList.add('show');}));
['dragleave','drop'].forEach(name=>document.addEventListener(name,e=>{e.preventDefault();if(name==='drop'){$('dropMask').classList.remove('show');const fs=[...e.dataTransfer.files].filter(f=>f.type.startsWith('image/'));if(fs.length)importFiles(fs);}else if(e.target===document.documentElement||e.target===document.body)$('dropMask').classList.remove('show');}));
init();
